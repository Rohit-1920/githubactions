name: Create Directory on EC2 (Password Auth)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  create-directory:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          sudo apt-get update -y
          sudo apt-get install -y sshpass
          sudo apt install nginx -y
          systemctl start nginx
          systemctl enable nginx
      - name: Connect to EC2 using password and create directory
        env:
          PROD_IP: ${{ secrets.PROD_IP }}
          PROD_USERNAME: ${{ secrets.PROD_USERNAME }}
          PROD_PASSWORD: ${{ secrets.PROD_PASSWORD }}
        run: |
          echo "Connecting to EC2 instance at ${PROD_IP}..."
          sshpass -p "${PROD_PASSWORD}" ssh -o StrictHostKeyChecking=no ${PROD_USERNAME}@${PROD_IP} \
          "mkdir -p ~/my_app_dir && ls -ld ~/my_app_dir"
