- name: Start SSH agent and add key
  env:
    PROD_KEY: ${{ secrets.PROD_KEY }}
  run: |
    eval "$(ssh-agent -s)"
    echo "$PROD_KEY" | ssh-add -
    
- name: Connect to EC2 and create directory
  env:
    PROD_IP: ${{ secrets.PROD_IP }}
    PROD_USERNAME: ${{ secrets.PROD_USERNAME }}
  run: |
    ssh -o StrictHostKeyChecking=no ${PROD_USERNAME}@${PROD_IP} "mkdir -p ~/my_app_dir && ls -ld ~/my_app_dir"
