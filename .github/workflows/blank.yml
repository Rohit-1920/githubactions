name: Create Directory on EC2

on:
  workflow_dispatch:  # allows manual trigger
  push:
    branches:
      - main  # run on main branch push (optional)

jobs:
  create-directory:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create directory on EC2
        env:
          PROD_KEY: ${{ secrets.PROD_KEY }}
          PROD_IP: ${{ secrets.PROD_IP }}
          PROD_USERNAME: ${{ secrets.PROD_USERNAME }}
        run: |
          # Write SSH key to a temporary file
          echo "$EC2_SSH_KEY" > private_key.pem
          chmod 600 private_key.pem

          # Create directory name (you can customize this)
          DIR_NAME="my_app_dir"

          echo "Connecting to EC2 instance and creating directory: $DIR_NAME"

          ssh -o StrictHostKeyChecking=no -i private_key.pem ${EC2_USER}@${EC2_HOST} "mkdir -p ~/${DIR_NAME} && ls -ld ~/${DIR_NAME}"

          echo "✅ Directory created successfully on EC2."

      - name: Cleanup
        run: rm -f private_key.pem
